<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lio wong</title>
  <link rel="icon" href="favicon.ico">
  <style>
    @font-face {
      font-family: 'ABCGravity';
      src: url('fonts/ABCGravity-Normal.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Avenir';
      src: url('fonts/Avenir.ttc') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff;
      font-family: 'ABCGravity', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .site-name {
      font-family: 'ABCGravity', sans-serif;
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.01em;
      color: #000;
      text-transform: lowercase;
    }

    .nav-links {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .nav-links a {
      font-family: 'ABCGravity', sans-serif;
      font-size: 2rem;
      color: #000;
      text-decoration: none;
      font-weight: normal;
    }

    .nav-links a:hover {
      color: #006BE2;
      opacity: 1;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .carousel-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .carousel-image-link {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 570px;
      height: min(570px, 70vh);
      outline: none;
    }

    .carousel-image {
      max-height: min(570px, 70vh);
      max-width: min(720px, 90vw);
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .carousel-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .carousel-btn {
      font-family: 'Avenir', sans-serif;
      font-size: 1.1rem;
      color: #000;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .carousel-btn:hover {
      color: #006BE2;
      opacity: 1;
    }

    .academic-link {
      position: fixed;
      bottom: 24px;
      left: 28px;
      font-family: 'Avenir', sans-serif;
      font-size: 0.85rem;
      color: #000;
      text-decoration: none;
    }

    .academic-link:hover {
      color: #006BE2;
      opacity: 1;
    }

    .carousel-counter {
      font-family: 'Avenir', sans-serif;
      font-size: 1.1rem;
      color: #000;
      font-weight: normal;
      letter-spacing: 0.02em;
    }
  </style>
</head>

<body>

  <header>
    <span class="site-name">lio wong</span>
    <nav class="nav-links">
      <a href="mailto:wong.lionel.mail@gmail.com" title="email">@</a>
      <a href="https://github.com/lio-wong/" title="link">&lt;</a>
      <a href="https://scholar.google.com/citations?user=KssJcIAAAAAJ&hl=en" title="tag">#</a>
      <a href="https://app.simplenote.com/publish/Zyr2yb" title="terminal">_</a>
    </nav>
  </header>

  <main>
    <div class="carousel-wrapper">
      <a class="carousel-image-link" href="#" id="image-link">
        <img class="carousel-image" id="carousel-img" src="" alt="carousel image">
      </a>
      <div class="carousel-nav">
        <button class="carousel-btn" id="btn-prev">&lt;</button>
        <div class="carousel-counter" id="counter"></div>
        <button class="carousel-btn" id="btn-next">&gt;</button>
      </div>
    </div>
  </main>

  <a class="academic-link" href="./academic.html">[academic]</a>

  <script>
    const images = [
      'images/alpha-smart-film-grain.png',
      'images/radio-film-grain.png',
      'images/clock-film-grain.png'
    ];

    const imagesBW = [
      'images/alpha-smart-film-grain-bw.png',
      'images/radio-film-grain-bw.png',
      'images/clock-film-grain-bw.png'
    ];

    const hrefs = [
      './misc.html',
      './noise.html',
      'https://exquisitetime.github.io/index.html'
    ];

    let current = 0;

    const img = document.getElementById('carousel-img');
    const counter = document.getElementById('counter');
    const link = document.getElementById('image-link');

    function pad(n) {
      return n < 10 ? '0' + n : '' + n;
    }

    function update() {
      img.src = images[current];
      img.alt = images[current];
      link.href = hrefs[current];
      link.target = hrefs[current].startsWith('http') ? '_blank' : '_self';
      counter.textContent = pad(current + 1) + ' / ' + pad(images.length);
    }

    document.getElementById('btn-prev').addEventListener('click', function () {
      current = (current - 1 + images.length) % images.length;
      update();
    });

    document.getElementById('btn-next').addEventListener('click', function () {
      current = (current + 1) % images.length;
      update();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') {
        current = (current + 1) % images.length;
        update();
      } else if (e.key === 'ArrowLeft') {
        current = (current - 1 + images.length) % images.length;
        update();
      }
    });

    link.addEventListener('mouseenter', function () {
      img.src = imagesBW[current];
    });

    link.addEventListener('mouseleave', function () {
      img.src = images[current];
    });

    update();
  </script>

</body>

</html>
